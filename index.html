<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GAO Logística · Protótipo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="static/css/app.css">
<link rel="stylesheet" href="static/css/gestor.css">
<link rel="stylesheet" href="static/css/kit.css">
<style>
body{min-height:100vh;display:flex;flex-direction:column;background:var(--bg);padding:0!important;margin:0}
.pick{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--space-8) var(--space-6)}
.pick>img{height:36px;display:block;margin-bottom:var(--space-5)}
.pick h1{font-size:20px;font-weight:600;text-align:center;margin:0 0 32px}
.grid{display:grid;align-items:stretch;grid-template-columns:1fr 1fr;gap:var(--space-6);width:100%;max-width:1000px}
.opt{display:flex;flex-direction:column;overflow:hidden;color:var(--fg);text-decoration:none;transition:transform .15s,border-color .15s}
.opt:hover{transform:translateY(-3px);border-color:var(--primary)}
.prev{height:300px;background:var(--row);border-bottom:1px solid var(--line);position:relative;overflow:hidden;display:flex;justify-content:center;align-items:flex-end}
/* janela de navegador (gestor) */
.win{width:86%;height:86%;background:var(--card);border:1px solid var(--line-strong);border-bottom:0;border-radius:10px 10px 0 0;overflow:hidden;display:flex;flex-direction:column}
.win i{display:flex;gap:5px;padding:8px 10px;border-bottom:1px solid var(--line);flex:none}
.win i b{width:7px;height:7px;border-radius:50%;background:var(--line-strong)}
.win img{width:100%;display:block;object-fit:cover;object-position:top left}
/* celular (motorista) */
.phone{width:170px;height:92%;background:var(--card);border:1px solid var(--line-strong);border-bottom:0;border-radius:24px 24px 0 0;overflow:hidden;padding:6px 6px 0}
.phone img{width:100%;display:block;border-radius:18px 18px 0 0}
.txt{padding:var(--space-5) var(--space-6);min-height:92px;display:flex;align-items:flex-start;gap:var(--space-4)}
.txt b{display:block;font-size:15px;font-weight:600}
.txt span.d{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.go{margin-left:auto;margin-top:2px;flex:none;font-size:13px;font-weight:600;color:var(--primary);display:inline-flex;align-items:center;gap:4px}
.foot{padding:var(--space-5);text-align:center;font-size:12px;color:var(--muted)}
@media(max-width:760px){.grid{grid-template-columns:1fr}.prev{height:220px}.phone{width:130px}}
</style>
</head>
<body>
<main class="pick">
  <img src="static/img/logo.svg" alt="GAO Logística">
  <h1>Qual protótipo você quer ver?</h1>
  <div class="grid">
    <a class="gk-card opt" href="login.html">
      <div class="prev"><div class="win"><i><b></b><b></b><b></b></i><img src="static/img/mock-gestor.webp" alt=""></div></div>
      <div class="txt"><div><b>Plataforma do gestor</b><span class="d">Operação, cadastros, viagens e comprovantes. Melhor no computador.</span></div><span class="go">Abrir<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></span></div>
    </a>
    <a class="gk-card opt" href="motorista/login.html">
      <div class="prev"><div class="phone"><img src="static/img/mock-motorista.webp" alt=""></div></div>
      <div class="txt"><div><b>App do motorista</b><span class="d">Rota, carregamento, entregas e coletas. Melhor no celular.</span></div><span class="go">Abrir<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></span></div>
    </a>
  </div>
</main>
<footer class="foot">© 2026 GAO Sistemas. Todos os direitos reservados.</footer>
</body>
</html>
