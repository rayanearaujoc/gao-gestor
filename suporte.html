<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>GAO Gestor · Suporte</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<script>try{if(JSON.parse(localStorage.getItem('gao_theme')||'null')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
<link rel="stylesheet" href="static/css/app.css">
<link rel="stylesheet" href="static/css/gestor.css">
<link rel="stylesheet" href="static/css/kit.css">
<style>#cats{grid-template-columns:repeat(3,1fr)}@media(max-width:900px){#cats{grid-template-columns:repeat(2,1fr)}}</style>
</head>
<body data-page="suporte">
  <main class="gpage">
    <div class="gk-page-head"><div><h1 class="gk-h1">Suporte</h1></div></div>
    <div class="gk-sup">
      <div class="gk-sup-hero">
        <h2 class="gk-sup-t">Como podemos ajudar?</h2>
        <p class="gk-sup-sub">Encontre respostas sobre a plataforma ou fale com a nossa equipe.</p>
        <div class="gk-sup-search"><input class="gk-input" id="q" placeholder="Busque por uma dúvida"><span class="gk-sup-search-btn"><i data-lucide="search" class="gk-ic"></i></span></div>
      </div>

      <div class="gk-sup-cats" id="cats"></div>

      <div class="gk-sup-sec">
        <div class="gk-sup-sech"><h3 class="gk-h2" id="secT"></h3><span class="gk-sup-n" id="secN"></span></div>
        <div class="gk-card gk-faq" id="faq"></div>
        <div class="gk-card gk-empty" id="empty" hidden><i data-lucide="search" class="gk-ic"></i><b>Nenhuma pergunta encontrada</b>Tente outros termos ou peça ajuda para a nossa equipe.</div>
      </div>

      <div class="gk-sup-sec">
        <h3 class="gk-h2">Ainda tem uma dúvida?</h3>
        <div class="gk-cta is-row">
          <span class="gk-cta-ic"><i data-lucide="headphones" class="gk-ic"></i></span>
          <div class="gk-cta-t"><b>Falar com a equipe</b><span>Problema, plano ou cobrança.</span></div>
          <button class="gk-btn gk-cta-btn" id="btnAjuda"><i data-lucide="message-circle" class="gk-ic"></i>Pedir ajuda</button>
        </div>
      </div>
    </div>
  </main>

  <!-- pedir ajuda -->
  <div class="gk-overlay" id="ovH"><div class="gk-scrim" data-close="ovH"></div>
    <div class="gk-modal is-form" role="dialog" aria-labelledby="hT">
      <div id="hForm">
        <div class="gk-modal-head"><div class="gk-modal-title"><span class="gk-title-ic"><i data-lucide="headphones" class="gk-ic"></i></span><h2 class="gk-h2" id="hT">Pedir ajuda</h2></div><button class="gk-btn gk-btn-secondary gk-btn-icon gk-btn-sm" data-close="ovH" aria-label="Fechar"><i data-lucide="x" class="gk-ic"></i></button></div>
        <div class="gk-modal-body" style="border-top:1px solid var(--line)"><div class="gk-form">
          <div class="gk-field"><label class="gk-label" for="hTopic">Sobre o que você quer falar?<span class="gk-req">*</span></label><select class="gk-select" id="hTopic"></select></div>
          <div class="gk-field" id="hExtraF" hidden><label class="gk-label" id="hExtraL"></label><select class="gk-select" id="hExtra"></select></div>
          <div class="gk-field"><label class="gk-label">Mensagem<span class="gk-req">*</span></label><textarea class="gk-textarea" id="hMsg" style="height:112px;padding:var(--space-3);resize:none" placeholder="Conte com poucas palavras o que você precisa"></textarea></div>
          <div class="gk-field"><label class="gk-label">Imagem</label><div class="gk-inline"><input type="file" id="hFile" accept="image/*" multiple hidden><button class="gk-btn gk-btn-secondary gk-btn-sm" type="button" id="hFileBtn"><i data-lucide="paperclip" class="gk-ic"></i>Anexar imagem</button><span class="gk-caption">Até 3 imagens</span></div><div class="gk-attach" id="hFiles"></div></div>
        </div></div>
        <div class="gk-modal-foot"><button class="gk-btn gk-btn-ghost" data-close="ovH">Cancelar</button><button class="gk-btn gk-btn-primary" id="hOk" disabled><i data-lucide="send" class="gk-ic"></i>Enviar pedido</button></div>
      </div>
      <div class="gk-modal-body gk-done" id="hDone" hidden></div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/lucide@1.60.0/dist/umd/lucide.min.js"></script>
<script src="static/js/shell.js"></script>
<script src="static/js/kit-ui.js"></script>
<script src="static/js/kit-icons.js"></script>
<script>
(function(){
  var $=function(id){ return document.getElementById(id); };
  /* cada assunto vai para uma caixa de e-mail diferente (mapear) */
  var TOPICS=[
    {k:'problema',t:'Problema no sistema',to:'suporte@gao.com.br',x:{l:'Onde aconteceu?',o:['Início ou Operação','Comandas','Clientes','Rotas','Motoristas','Veículos','Viagens e comprovantes','Multas','App do motorista','Outro']}},
    {k:'duvida',t:'Dúvida de uso',to:'suporte@gao.com.br'},
    {k:'plano',t:'Trocar de plano',to:'comercial@gao.com.br',x:{l:'Plano desejado',o:['Com CRM GAO','Sem CRM']}},
    {k:'cobranca',t:'Cobrança e pagamento',to:'financeiro@gao.com.br'},
    {k:'sugestao',t:'Sugestão de melhoria',to:'produto@gao.com.br'}
  ];
  var FAQ=[
    {c:'Primeiros passos',q:'Recebi meu acesso. O que faço primeiro?',a:'A GAO cria a sua empresa e o seu usuário e envia o acesso. Ao entrar, a plataforma vem vazia. Siga os Primeiros passos da tela Início, na ordem: clientes, motoristas, veículos e rotas.'},
    {c:'Primeiros passos',q:'Por que um cliente aparece como pendente?',a:'O cliente fica pendente até ter o endereço completo (com CEP), o WhatsApp para contato e uma rota. Complete o cadastro em Clientes e ele passa a Ativo.'},
    {c:'Primeiros passos',q:'Cadastrei o motorista, mas ele não consegue entrar no app. O que verifico?',a:'Confira se o usuário e a senha foram definidos na etapa Acesso ao app e se o motorista está como Ativo. Motorista inativo perde o acesso. Para trocar a senha, edite o cadastro dele e digite uma nova.'},
    {c:'Primeiros passos',q:'Esqueci minha senha. Como recupero?',a:'Peça à GAO em Pedir ajuda. Quando estiver logado, você pode trocar a senha por conta própria em Meu perfil, na aba Segurança.'},
    {c:'Primeiros passos',q:'Posso colocar um cliente em mais de uma rota?',a:'Não. Cada cliente pertence a uma única rota, para não haver dúvida de qual rota leva a comanda. Já um motorista pode estar em mais de uma rota, e uma rota pode ter até dois motoristas.'},
    {c:'Comandas',q:'As comandas vêm do CRM ou eu preciso criar?',a:'Depende do plano. Com o CRM GAO, a comanda entra sozinha, aparece no app do motorista e as etiquetas já saem impressas, então você só acompanha. Sem o CRM, você cria a comanda em Comandas e imprime as etiquetas com QR Code.'},
    {c:'Comandas',q:'Liberei uma comanda e o motorista não a vê no app. O que pode ser?',a:'Confira se o cliente tem uma rota, se essa rota tem motorista e se a comanda está Liberada (com o CRM, depois da expedição realizada). Se ninguém carregar em mais de 24 horas, o aviso aparece em Operação e você pode designar a comanda a um motorista.'},
    {c:'Comandas',q:'Como imprimo ou reimprimo as etiquetas?',a:'Sem o CRM, na lista de Comandas, use o ícone de impressora na linha da comanda de entrega. Cada gaiola tem a sua etiqueta com QR Code. Com o CRM, as etiquetas são impressas pela produção.'},
    {c:'Comandas',q:'Qual a diferença entre comanda de entrega e de coleta?',a:'Cada comanda é só uma coisa: entrega ou coleta. Ao entregar, o sistema abre uma coleta pendente do cliente. Se o cliente pedir uma coleta, você cria a comanda de coleta, que fica como Aguardando coleta e entra no app do motorista.'},
    {c:'Comandas',q:'Posso excluir uma comanda?',a:'Sim, sem o CRM, na lista de Comandas. As etiquetas já impressas dessa comanda deixam de valer, então confirme antes de excluir.'},
    {c:'Operação',q:'Uma viagem apareceu como parada. O que faço?',a:'Em Operação, abra o aviso de viagem parada e use Avisar. O WhatsApp abre com a mensagem pronta para o motorista, e você só confirma o envio.'},
    {c:'Operação',q:'Falta um motorista hoje. Como cubro a rota?',a:'Em Operação, designe um motorista para a rota, por exemplo um folguista. Vale só para hoje e o cadastro da rota não muda. O folguista não tem rota fixa e monta uma rota extra no app.'},
    {c:'Operação',q:'Com dois motoristas na mesma rota, quem leva cada comanda?',a:'Quem carregar primeiro. Cada motorista segue só o que carregou, e a comanda carregada por um some da lista do outro.'},
    {c:'Operação',q:'Como funciona a coleta?',a:'A coleta só acontece depois das entregas. O motorista informa as gaiolas na própria parada. Se não houver coletas, ele vai direto ao check-out. O comprovante junta entrega e coleta da mesma parada.'},
    {c:'Operação',q:'O caminhão teve um acidente. O que acontece com a viagem?',a:'O motorista registra o acidente no app, e a viagem é encerrada. Os clientes que ainda não foram atendidos recebem a mensagem automática de entrega reagendada, e a sua equipe entra em contato para remarcar.'},
    {c:'Operação',q:'Um motorista saiu da empresa. Como removo o acesso dele?',a:'Edite o motorista e deixe o acesso como Inativo. Ele perde o acesso ao app, e o histórico de viagens dele continua guardado.'},
    {c:'WhatsApp',q:'Quais mensagens o cliente recebe?',a:'Pelo número da empresa saem duas, de forma automática: a caminho, quando o motorista inicia as entregas, e o resultado da entrega (concluída com o comprovante, não realizada com o motivo, ou reagendada por acidente).'},
    {c:'WhatsApp',q:'Por que o aviso de chegada não aparece em Mensagens?',a:'Porque ele sai do WhatsApp do próprio motorista, pelo botão Avisar cliente, e o sistema não tem acesso a essa conversa. O mesmo vale para o aviso de viagem parada e para o envio avulso de comprovante: o WhatsApp abre com a mensagem pronta, quem pediu confirma o envio e isso não entra no histórico.'},
    {c:'WhatsApp',q:'Um cliente diz que não recebeu a mensagem. Como confiro?',a:'Em Mensagens, procure o cliente e veja o texto enviado e se houve falha. Confira também se o WhatsApp para contato dele em Clientes está correto.'},
    {c:'WhatsApp',q:'As mensagens automáticas pararam de sair. O que pode ser?',a:'O número da empresa pode ter desconectado. A conexão é feita pela GAO, que recebe o alerta. Se notar a falha antes, avise em Pedir ajuda para a GAO reconectar.'},
    {c:'WhatsApp',q:'Como troco o número de WhatsApp da empresa?',a:'Peça à GAO em Pedir ajuda. O novo número é conectado pela GAO, e você não precisa fazer nada na plataforma.'},
    {c:'Histórico',q:'Como envio de novo um comprovante ao cliente?',a:'Em Comprovantes, ou no perfil do cliente, use Enviar. O WhatsApp abre com a mensagem pronta e o link do comprovante, e você confirma o envio.'},
    {c:'Histórico',q:'Onde vejo o que o motorista fez em uma viagem?',a:'Em Viagens, abra a viagem. Se estiver em andamento, aparece o que ele já fez e o que falta. Se estiver concluída, aparecem os dados da viagem, o consumo médio, as fotos do veículo e os comprovantes de cada cliente.'},
    {c:'Histórico',q:'Como designo uma multa a um motorista?',a:'Em Multas, envie o PDF. O sistema encontra a placa e o dia, mostra as viagens daquele dia e você escolhe o motorista em Designar. A GAO só mantém o registro por motorista e não indica o condutor ao órgão.'},
    {c:'Histórico',q:'Quem informa os saneantes que aparecem no comprovante?',a:'Você, em Configurações, na aba Saneantes. O motorista não escolhe nada, e o saneante marcado como em uso vai para o comprovante.'},
    {c:'Conta e plano',q:'Onde vejo o plano e os dados da minha empresa?',a:'Em Configurações. Lá ficam o plano contratado e os dados da empresa, que são só de leitura.'},
    {c:'Conta e plano',q:'Como altero os dados da empresa ou o plano?',a:'Clique em Pedir ajuda e escolha o assunto. Trocar de plano vai para o comercial, e a mudança dos dados vai para o suporte.'},
    {c:'Conta e plano',q:'Preciso de mais um usuário gestor. Como faço?',a:'Os usuários da plataforma são criados pela GAO. Peça em Pedir ajuda, com o nome e o e-mail da pessoa.'},
    {c:'Conta e plano',q:'Como relato um problema no sistema?',a:'Clique em Pedir ajuda, escolha Problema no sistema, diga onde aconteceu e descreva o que viu. A mensagem vai direto para o time de suporte.'}
  ];
  var CATS=[
    {c:'Primeiros passos',ic:'clipboard-check'},{c:'Comandas',ic:'clipboard-list'},{c:'Operação',ic:'truck'},{c:'WhatsApp',ic:'message-circle'},{c:'Histórico',ic:'receipt'},{c:'Conta e plano',ic:'credit-card'}
  ], cat='Primeiros passos', q='';
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  function cnt(c){ return FAQ.filter(function(f){ return f.c===c; }).length; }
  function render(){
    $('cats').innerHTML=CATS.map(function(x){ var on=!q&&x.c===cat; return '<button type="button" class="gk-sup-cat'+(on?' is-active':'')+'" data-c="'+x.c+'"><span class="gk-sup-cat-ic"><i data-lucide="'+x.ic+'" class="gk-ic"></i></span><span class="gk-sup-cat-t"><b>'+x.c+'</b><span>'+cnt(x.c)+' perguntas</span></span></button>'; }).join('');
    var l=FAQ.filter(function(f){ return q?(f.q+' '+f.a).toLowerCase().indexOf(q)>=0:f.c===cat; });
    $('secT').textContent=q?'Resultados da busca':cat; $('secN').textContent=l.length+(l.length===1?' pergunta':' perguntas');
    $('faq').innerHTML=l.map(function(f){ return '<div class="gk-faq-i"><button type="button" class="gk-faq-q" aria-expanded="false"><span>'+esc(f.q)+'</span><i data-lucide="plus" class="gk-ic gk-faq-plus"></i><i data-lucide="minus" class="gk-ic gk-faq-minus"></i></button><div class="gk-faq-a" hidden>'+esc(f.a)+GK.feedbackHTML('Esta resposta ajudou?')+'</div></div>'; }).join('');
    $('faq').hidden=!l.length; $('empty').hidden=l.length>0; GK.icons();
  }
  $('cats').addEventListener('click',function(e){ var b=e.target.closest('[data-c]'); if(b){ cat=b.getAttribute('data-c'); q=''; $('q').value=''; render(); } });
  $('q').addEventListener('input',function(){ q=this.value.toLowerCase().trim(); render(); });
  $('faq').addEventListener('click',function(e){ var b=e.target.closest('.gk-faq-q'); if(!b) return; var i=b.parentNode, a=i.querySelector('.gk-faq-a'), on=a.hidden; a.hidden=!on; i.classList.toggle('is-open',on); b.setAttribute('aria-expanded',on); });

  /* pedir ajuda */
  var sel=null;
  $('hTopic').innerHTML='<option value="">Selecione</option>'+TOPICS.map(function(t){ return '<option value="'+t.k+'">'+t.t+'</option>'; }).join('');
  var files=[];
  function lista(){ $('hFiles').innerHTML=files.map(function(f,i){ return '<div class="gk-attach-i"><img src="'+f.u+'" alt=""><span>'+f.n+'</span><button type="button" class="gk-btn gk-btn-ghost gk-btn-icon gk-btn-sm" data-rm="'+i+'" aria-label="Remover"><i data-lucide="x" class="gk-ic"></i></button></div>'; }).join(''); $('hFileBtn').disabled=files.length>=3; GK.icons(); }
  $('hFileBtn').addEventListener('click',function(){ $('hFile').click(); });
  $('hFile').addEventListener('change',function(){ Array.prototype.slice.call($('hFile').files).forEach(function(f){ if(files.length<3) files.push({n:f.name,u:URL.createObjectURL(f)}); }); $('hFile').value=''; lista(); });
  $('hFiles').addEventListener('click',function(e){ var b=e.target.closest('[data-rm]'); if(!b) return; files.splice(+b.getAttribute('data-rm'),1); lista(); });
  function chk(){ $('hOk').disabled=!(sel&&$('hMsg').value.trim().length>=10); }
  function setTopic(k){
    sel=TOPICS.filter(function(t){ return t.k===k; })[0]||null;
    $('hTopic').value=sel?sel.k:'';
    var x=sel&&sel.x; $('hExtraF').hidden=!x; if(x){ $('hExtraL').textContent=x.l; $('hExtra').innerHTML='<option value="">Selecione</option>'+x.o.map(function(o){ return '<option>'+o+'</option>'; }).join(''); }
    chk();
  }
  function abrir(k){ $('hForm').hidden=false; $('hDone').hidden=true; $('hMsg').value=''; files=[]; lista(); setTopic(k||null); GK.open('ovH'); GK.icons(); }
  $('hTopic').addEventListener('change',function(e){ setTopic(e.target.value); });
  $('hMsg').addEventListener('input',chk);
  $('btnAjuda').addEventListener('click',function(){ abrir(); });
  $('hOk').addEventListener('click',function(){
    var p='GAO-'+Math.floor(10000+Math.random()*89999);
    $('hForm').hidden=true; $('hDone').hidden=false;
    $('hDone').innerHTML='<div class="gk-done-ic"><i data-lucide="check" class="gk-ic"></i></div><h3 class="gk-h2">Pedido enviado</h3><p>Recebemos sua mensagem sobre <b>'+sel.t.toLowerCase()+'</b>. Nossa equipe responde por e-mail em até 1 dia útil.</p><div class="gk-caption">Protocolo '+p+'</div><button class="gk-btn gk-btn-secondary" data-close="ovH">Fechar</button>';
    GK.icons();
  });
  GK.popovers(); render();
})();
</script>
</body>
</html>
