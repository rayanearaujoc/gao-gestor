<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>GAO Gestor · Mensagens</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<script>try{if(JSON.parse(localStorage.getItem('gao_theme')||'null')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
<link rel="stylesheet" href="static/css/app.css">
<link rel="stylesheet" href="static/css/gestor.css">
<link rel="stylesheet" href="static/css/kit.css">
</head>
<body data-page="mensagens">
  <main class="gpage">
    <div class="gk-page-head"><div><h1 class="gk-h1">Mensagens</h1></div></div>
    <div class="gk-stats is-2" style="margin-bottom:var(--space-5)">
      <div class="gk-card gk-stat"><div class="gk-stat-h"><span class="gk-stat-ic"><i data-lucide="message-circle" class="gk-ic"></i></span>Mensagens enviadas</div><div class="gk-stat-v" id="stT"></div><div class="gk-stat-l">Avisos automáticos aos clientes</div></div>
      <div class="gk-card gk-stat"><div class="gk-stat-h"><span class="gk-stat-ic"><i data-lucide="triangle-alert" class="gk-ic"></i></span>Falhas no envio</div><div class="gk-stat-v" id="stF"></div><div class="gk-stat-l">Mensagens que não chegaram ao cliente</div></div>
    </div>
    <div class="gk-table-wrap">
      <div class="gk-toolbar" style="flex-wrap:nowrap">
        <div class="gk-input-wrap" style="flex:1 1 200px;min-width:160px;max-width:440px"><i data-lucide="search" class="gk-ic"></i><input class="gk-input" id="q" placeholder="Busque por cliente ou viagem"></div>
        <div class="gk-pop-anchor"><button class="gk-btn gk-btn-secondary" id="fCli" data-pop="popCli"><i data-lucide="building-2" class="gk-ic"></i><span>Cliente</span><i data-lucide="chevron-down" class="gk-ic gk-caret"></i></button><div class="gk-pop gk-filter-pop" id="popCli"><div class="gk-fp-body"><label class="gk-check"><input type="checkbox" value="Hospital Amparo">Hospital Amparo</label><label class="gk-check"><input type="checkbox" value="HEMU">HEMU</label><label class="gk-check"><input type="checkbox" value="Santa Casa">Santa Casa</label><label class="gk-check"><input type="checkbox" value="Albert Einstein">Albert Einstein</label><label class="gk-check"><input type="checkbox" value="Hotel Le Jardin">Hotel Le Jardin</label><label class="gk-check"><input type="checkbox" value="Laboratório Central">Laboratório Central</label></div><div class="gk-fp-foot"><button type="button" data-clear style="font-size:12px;color:var(--muted);background:none;border:0;cursor:pointer">Limpar</button><button type="button" class="gk-btn gk-btn-primary gk-btn-sm" data-apply>Aplicar</button></div></div></div>
        <div class="gk-pop-anchor"><button class="gk-btn gk-btn-secondary" id="fTipo" data-pop="popTipo"><i data-lucide="filter" class="gk-ic"></i><span>Tipo</span><i data-lucide="chevron-down" class="gk-ic gk-caret"></i></button><div class="gk-pop gk-filter-pop" id="popTipo"><div class="gk-fp-body"><label class="gk-check"><input type="checkbox" value="Entrega">Entrega</label><label class="gk-check"><input type="checkbox" value="Coleta">Coleta</label><label class="gk-check"><input type="checkbox" value="Entrega e coleta">Entrega e coleta</label></div><div class="gk-fp-foot"><button type="button" data-clear style="font-size:12px;color:var(--muted);background:none;border:0;cursor:pointer">Limpar</button><button type="button" class="gk-btn gk-btn-primary gk-btn-sm" data-apply>Aplicar</button></div></div></div>
        <div class="gk-pop-anchor"><button class="gk-btn gk-btn-secondary" id="fSit" data-pop="popSit"><i data-lucide="circle-check" class="gk-ic"></i><span>Envio</span><i data-lucide="chevron-down" class="gk-ic gk-caret"></i></button><div class="gk-pop gk-filter-pop" id="popSit"><div class="gk-fp-body"><label class="gk-check"><input type="checkbox" value="Com falha">Com falha</label><label class="gk-check"><input type="checkbox" value="Sem falhas">Sem falhas</label></div><div class="gk-fp-foot"><button type="button" data-clear style="font-size:12px;color:var(--muted);background:none;border:0;cursor:pointer">Limpar</button><button type="button" class="gk-btn gk-btn-primary gk-btn-sm" data-apply>Aplicar</button></div></div></div>
        <div class="gk-pop-anchor">
          <button class="gk-btn gk-btn-secondary" id="fPer" data-pop="popPer"><i data-lucide="calendar" class="gk-ic"></i><span>Período</span><i data-lucide="chevron-down" class="gk-ic gk-caret"></i></button>
          <div class="gk-pop gk-menu" id="popPer"></div>
        </div>
        <button class="gk-btn gk-btn-ghost" id="clearAll" hidden>Limpar filtros</button>
      </div>
      <table class="gk-table is-compact">
        <thead><tr><th>Data</th><th data-card-title>Cliente</th><th>Tipo</th><th>Origem</th><th>Mensagens</th><th>Falhas</th><th class="gk-col-actions" style="width:80px">Ações</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="vazio" hidden></div>
      <div class="gk-empty" id="empty" hidden><i data-lucide="search" class="gk-ic"></i><b>Nenhuma mensagem encontrada</b>Tente ajustar os termos da busca ou remover os filtros.<div style="margin-top:var(--space-4)"><button class="gk-btn gk-btn-secondary" id="clearEmpty">Limpar filtros</button></div></div>
      <div class="gk-tfoot"><span id="cnt"></span><div class="gk-pager" id="pager"></div></div>
    </div>
  </main>

  <div class="gk-overlay" id="ovMsg"><div class="gk-scrim" data-close="ovMsg"></div>
    <div class="gk-modal is-form" role="dialog" aria-labelledby="msgTitle" style="width:min(560px,calc(100% - 32px))">
      <div class="gk-modal-head"><div class="gk-modal-title"><span class="gk-title-ic"><i data-lucide="message-circle" class="gk-ic"></i></span><h2 class="gk-h2" id="msgTitle">Mensagens do comprovante</h2></div><button class="gk-btn gk-btn-secondary gk-btn-icon gk-btn-sm" data-close="ovMsg" aria-label="Fechar"><i data-lucide="x" class="gk-ic"></i></button></div>
      <div class="gk-modal-body" style="border-top:1px solid var(--line);max-height:min(560px,70vh);overflow:auto">
        <div class="gk-caption" id="msgSub"></div>
        <div id="msgList" style="display:flex;flex-direction:column;gap:var(--space-5);margin-top:var(--space-5)"></div>
      </div>
      <div class="gk-modal-foot"><button class="gk-btn gk-btn-ghost" data-close="ovMsg">Fechar</button></div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/lucide@1.60.0/dist/umd/lucide.min.js"></script>
<script src="static/js/shell.js"></script>
<script src="static/js/kit-ui.js"></script>
<script src="static/js/kit-icons.js"></script>
<script src="static/js/clientes-data.js"></script>
<script>
(function(){
  var CLI=['Hospital Amparo', 'HEMU', 'Santa Casa', 'Albert Einstein', 'Hotel Le Jardin', 'Laboratório Central'], MOT=['Ronaldo Araújo','Bruno Castro','Diego Martins','Paulo Ribeiro'];
  var TIPOS=['Entrega e coleta','Entrega','Entrega e coleta','Coleta','Entrega','Entrega e coleta'];
  function ini(n){ var p=n.split(' ').filter(function(x){ return x&&!/^(de|da|do|das|dos|e)$/i.test(x); }); return (p.length>1?p[0][0]+p[1][0]:n.slice(0,2)).toUpperCase(); }
  function pad(n){ return (n<10?'0':'')+n; }
  function hm(min){ return pad(Math.floor(min/60))+':'+pad(min%60); }
  /* textos exatamente como no documento "Fluxo de mensagens WhatsApp (Z-API)". Só duas mensagens saem pelo número da GAO:
     "a caminho" e o desfecho (entrega concluída, não foi possível entregar ou, no acidente, entrega reagendada).
     O "cheguei" sai do celular do motorista (link wa.me), não passa pelo sistema e por isso não aparece aqui. */
  var MOTIVOS=['não havia ninguém no local para receber a remessa.','a remessa foi recusada no momento da entrega.','o local estava fechado ou sem acesso no horário da entrega.'];
  var TXT={
    'A caminho':function(c){ return 'Olá, '+c.cli+'! Seu enxoval hospitalar limpo saiu para entrega hoje. O motorista '+c.mot+' já está a caminho com a sua remessa e em breve chega até vocês. GAO Logística'; },
    'Entrega concluída':function(c){ return 'Entrega concluída! '+c.cli+', seu enxoval limpo foi entregue hoje ('+c.data+') por '+c.mot+'. O comprovante com as fotos e os itens está aqui: <span class="gk-wa-l">gao.app/c/'+c.cod+'</span> Obrigado por confiar na GAO.'; },
    'Não foi possível entregar':function(c){ return 'Olá, '+c.cli+'. Infelizmente não foi possível concluir a entrega do seu enxoval hoje ('+c.data+'). Motivo: '+MOTIVOS[c.k%3]+' Nossa equipe já foi avisada e vai entrar em contato para reagendar. GAO Logística'; },
    'Entrega reagendada':function(c){ return 'Olá, '+c.cli+'. Tivemos um imprevisto com o nosso veículo durante a rota de hoje ('+c.data+') e, por segurança, a entrega do seu enxoval precisará ser reagendada. Pedimos desculpas pelo transtorno. Nossa equipe já vai entrar em contato para remarcar. GAO Logística'; }
  };
  // um comprovante por cliente de cada viagem; cada um tem o seu grupo de mensagens
  var COMP=[], idc=0;
  for(var i=0;i<14;i++){
    var viagem=1048-i, d=12-Math.floor(i/2), n=3+(i%3), t=7*60+30+(i*11)%40;
    for(var k=0;k<n;k++){
      var nome=CLI[(i+k)%CLI.length], msgs=[], h=t+30+k*55;
      var fim=(i===3&&k===1)?'Não foi possível entregar':((i===8&&k===2)?'Entrega reagendada':'Entrega concluída');
      msgs.push({tipo:'A caminho',hora:hm(t),st:'Lida'});
      msgs.push({tipo:fim,hora:hm(h+(fim==='Entrega reagendada'?20:12)),st:'Lida'});
      msgs.forEach(function(m,j){ if((i===2&&k===0&&j===1)||(i===5&&k===1&&j===0)||(i===9&&k===2&&j===1)) m.st='Falhou'; else if(i===0&&j>0) m.st='Entregue'; });
      var fal=msgs.filter(function(m){ return m.st==='Falhou'; }).length;
      COMP.push({id:idc++,mot:MOT[i%4],k:k,cod:(viagem*7+k*131).toString(36),data:pad(d)+'/11/2026',cli:nome,tipo:TIPOS[(i+k)%TIPOS.length],viagem:viagem,msgs:msgs,tot:msgs.length,fal:fal});
    }
  }
  if(window.GAO_VAZIO) COMP.length=0;
  var BADGE={'Entregue':'gk-badge gk-badge-info','Lida':'gk-badge gk-badge-ok','Falhou':'gk-badge gk-badge-bad'};
  var state={q:'',cli:[],tipo:[],sit:[],page:1}, PAGE=10, shown=[];
  var tbody=document.getElementById('tbody'), empty=document.getElementById('empty');
  function row(c){
    return '<tr class="gk-row-link" data-id="'+c.id+'"><td>'+c.data+'</td><td class="gk-strong">'+c.cli+'</td><td>'+c.tipo+'</td>'
      +'<td><a class="gk-linkbtn" href="viagem.html?v='+c.viagem+'">Viagem #'+c.viagem+'</a></td><td>'+c.tot+'</td>'
      +'<td>'+(c.fal?'<span class="gk-strong" style="color:var(--bad-ink)">'+c.fal+'</span>':'<span class="gk-caption">—</span>')+'</td>'
      +'<td class="gk-col-actions"><span class="gk-acts"><button class="gk-act" data-ver="'+c.id+'" aria-label="Ver mensagens" title="Ver"><i data-lucide="eye" class="gk-ic"></i></button></span></td></tr>';
  }
  function apply(){
    var list=COMP.filter(function(c){
      return (!state.q||(c.cli+' '+c.viagem).toLowerCase().indexOf(state.q)>=0)&&(!state.cli.length||state.cli.indexOf(c.cli)>=0)&&(!state.tipo.length||state.tipo.indexOf(c.tipo)>=0)
        &&(!state.sit.length||(state.sit.indexOf('Com falha')>=0&&c.fal>0)||(state.sit.indexOf('Sem falhas')>=0&&!c.fal))&&fP.test(c.data); });
    var tt=0,ff=0; list.forEach(function(c){ tt+=c.tot; ff+=c.fal; });
    document.getElementById('stT').textContent=tt; document.getElementById('stF').textContent=ff;
    var total=list.length, pages=Math.max(1,Math.ceil(total/PAGE)); if(state.page>pages) state.page=pages;
    var start=(state.page-1)*PAGE; shown=list.slice(start,start+PAGE);
    tbody.innerHTML=shown.map(row).join('');
    var zero=COMP.length===0; empty.hidden=zero||total>0; tbody.closest('table').hidden=total===0;
    GK.firstUse(zero,{icon:'message-circle',title:'Nenhuma mensagem ainda',text:'Os avisos enviados aos clientes aparecem aqui, junto de cada comprovante.'});
    document.getElementById('cnt').textContent=total===0?'Nenhum comprovante encontrado':('Mostrando '+(start+1)+'–'+Math.min(start+PAGE,total)+' de '+total);
    var pg=document.getElementById('pager'); pg.innerHTML='';
    function mk(label,page,on,dis,aria){ var b=document.createElement('button'); b.type='button'; b.className='gk-btn gk-btn-ghost gk-btn-sm'+(on?' is-active':''); b.innerHTML=label; if(aria) b.setAttribute('aria-label',aria); b.disabled=dis; if(!dis&&!on) b.addEventListener('click',function(){ state.page=page; apply(); }); pg.appendChild(b); }
    mk('<i data-lucide="chevron-left" class="gk-ic"></i>',state.page-1,false,state.page<=1,'Anterior');
    for(var i=1;i<=pages;i++) mk(String(i),i,i===state.page,false);
    mk('<i data-lucide="chevron-right" class="gk-ic"></i>',state.page+1,false,state.page>=pages,'Próxima');
    document.getElementById('clearAll').hidden=!(state.cli.length||state.tipo.length||state.sit.length||fP.active());
    GK.icons();
  }
  document.getElementById('q').addEventListener('input',function(){ state.q=this.value.toLowerCase().trim(); state.page=1; apply(); });
  var fCli=GK.checkFilter({btn:'fCli',pop:'popCli',label:'Cliente',onChange:function(v){ state.cli=v; state.page=1; apply(); }});
  var fTipo=GK.checkFilter({btn:'fTipo',pop:'popTipo',label:'Tipo',onChange:function(v){ state.tipo=v; state.page=1; apply(); }});
  var fSit=GK.checkFilter({btn:'fSit',pop:'popSit',label:'Envio',onChange:function(v){ state.sit=v; state.page=1; apply(); }});
  var fP=GK.periodFilter({btn:'fPer',pop:'popPer',onChange:function(){ state.page=1; apply(); }});
  function reset(){ fCli.reset(); fTipo.reset(); fSit.reset(); fP.reset(); }
  document.getElementById('clearAll').addEventListener('click',reset);
  document.getElementById('clearEmpty').addEventListener('click',function(){ document.getElementById('q').value=''; state.q=''; reset(); });
  function abrir(id){
    var c=COMP.filter(function(x){ return x.id==id; })[0]; if(!c) return;
    document.getElementById('msgTitle').textContent=c.cli;
    document.getElementById('msgSub').innerHTML=c.tipo+'<span class="gk-sep"></span>Viagem #'+c.viagem+'<span class="gk-sep"></span>'+c.data+'<span class="gk-sep"></span><a class="gk-linkbtn" href="comprovante.html?c='+c.id+'">Ver comprovante</a>';
    document.getElementById('msgList').innerHTML=c.msgs.map(function(m){
      var falhou=m.st==='Falhou';
      return '<div><div style="display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);margin-bottom:var(--space-2)"><div class="gk-caption"><b class="gk-strong" style="color:var(--fg)">'+m.tipo+'</b><span class="gk-sep"></span>'+m.hora+'</div><span class="'+BADGE[m.st]+' gk-badge-plain">'+m.st+'</span></div>'
        +'<div class="gk-wa">'+TXT[m.tipo](c)+'</div>'
        +(falhou?'<div class="gk-caption" style="margin-top:var(--space-2);color:var(--bad-ink)">O envio falhou. Confira o número do cliente no cadastro.</div>':'')+'</div>';
    }).join('');
    GK.open('ovMsg'); GK.icons();
  }
  tbody.addEventListener('click',function(e){ var b=e.target.closest('[data-ver]'); if(b){ abrir(b.getAttribute('data-ver')); return; } if(e.target.closest('a')) return; var tr=e.target.closest('tr'); if(tr) abrir(tr.getAttribute('data-id')); });
  GK.popovers(); apply();
})();
</script>
</body>
</html>
